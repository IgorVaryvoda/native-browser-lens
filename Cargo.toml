[package]
name = "lens"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
directories = "6.0.0"
interprocess = "2.4.8"
keyring = "4.2.0"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
url = "2.5.8"

[target."cfg(windows)".dependencies]
widestring = "1.2.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading"] }
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"
